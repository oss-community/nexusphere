server:
  address: ${APP_HOST:0.0.0.0}
  port: ${APP_PORT:8080}
  error:
    whitelabel:
      enabled: false
spring:
  application:
    name: nexusphere
  profiles:
    active: ${APP_PROFILES:postgresql}
  mvc:
    problemdetails:
      enabled: false
nexusphere:
  security:
    token:
      issuer: ${APP_TOKEN_ISSUER:nexusphere}
      secret: ${APP_TOKEN_SECRET:nexusphere-development-token-secret-change-me}
      ttl: ${APP_TOKEN_TTL:15m}
  persistence:
    modules:
      - network
      - organization
      - identity
      - membership
      - capability
      - trust
      - federation
      - authorization
      - delegation
      - agreement
      - transaction
      - audit
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    build:
      enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  include-application-name: false
