server:
  address: ${APP_HOST:0.0.0.0}
  port: ${APP_PORT:8080}
  tomcat:
    threads:
      max: ${APP_HTTP_THREADS:20}
  error:
    whitelabel:
      enabled: false
spring:
  application:
    name: nexusphere
  config:
    import: optional:configtree:${APP_SECRETS_DIR:/run/secrets/}
  profiles:
    active: ${APP_PROFILES:postgresql}
  mvc:
    problemdetails:
      enabled: false
nexusphere:
  security:
    token:
      issuer: ${APP_TOKEN_ISSUER:nexusphere}
      secret: ${APP_TOKEN_SECRET:}
      ttl: ${APP_TOKEN_TTL:15m}
    operator:
      secret: ${APP_OPERATOR_SECRET:}
  identity:
    credential:
      ttl: ${APP_CREDENTIAL_TTL:90d}
      max-ttl: ${APP_CREDENTIAL_MAX_TTL:365d}
  persistence:
    modules:
      - network
      - organization
      - identity
      - membership
      - capability
      - trust
      - federation
      - authorization
      - delegation
      - agreement
      - transaction
      - audit
      - integration
  ledger:
    url: ${APP_LEDGER_URL:}
    api-key: ${APP_LEDGER_API_KEY:}
    forward-interval: ${APP_LEDGER_FORWARD_INTERVAL:5s}
    batch-size: ${APP_LEDGER_BATCH_SIZE:100}
management:
  server:
    port: ${APP_MANAGEMENT_PORT:}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: nexusphere
  endpoint:
    health:
      probes:
        enabled: true
  info:
    build:
      enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  include-application-name: false
