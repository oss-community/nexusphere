# mvn-devops settings of this project. Commit this file: everyone who
# clones the project gets the same tools and answers. Secrets are not here.
PROJECT_NAME=nexusphere
ORCHESTRATOR=maven
MODULES=scm/github build/maven orchestrator/maven database/postgresql image/docker-registry deploy/docker-host secrets/vault
ENVIRONMENTS=dev test staging prod
ENV_DEV_APPROVAL=no
ENV_TEST_APPROVAL=no
ENV_STAGING_APPROVAL=no
ENV_PROD_APPROVAL=yes
IMAGE_NAME=nexusphere-ledger
IMAGE_MODULE=ledger/server
IMAGE_BUILDER=jib
IMAGE_PORT=8090
DATABASE_NAME=ledger
FLYWAY_LOCATIONS=filesystem:ledger/server/src/main/resources/db/migration/ledger -Dflyway.schemas=ledger -Dflyway.defaultSchema=ledger -Dflyway.createSchemas=true
PIPELINE=nexusphere
GITHUB_URL=https://github.com
GITHUB_REPOSITORY=oss-community/nexusphere
GIT_BRANCH=main
JAVA_VERSION=21
MAVEN_VERSION=3.9
MAVEN_SETTINGS=
MAVEN_PROFILES=
MAVEN_ATTACH_SOURCES=yes
MAVEN_CHECKSTYLE=no
MAVEN_CHECKSTYLE_CONFIG=google_checks.xml
DATABASE_HOST_PORT=5440
FLYWAY_VERSION=12.4.0
REGISTRY_SERVER_URL=
REGISTRY_HOST_PORT=5000
IMAGE_BASE=eclipse-temurin:21-jre
DEPLOY_SERVER_URL=
DEPLOY_SSH_HOST_PORT=2222
DEPLOY_DEV_PORT=8301
DEPLOY_TEST_PORT=8302
DEPLOY_STAGING_PORT=8303
DEPLOY_PROD_PORT=8304
DEPLOY_HEALTH_PATH=/actuator/health
VAULT_HOST_PORT=8201
VAULT_SERVER_URL=
VAULT_KV_MOUNT=secret
