global:
  scrape_interval: 15s
  evaluation_interval: 15s
alerting:
  alertmanagers:
    - static_configs:
        - targets: [ "alertmanager:9093" ]
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: nexusphere-ledger
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "ledger:8090" ]
  - job_name: nexusphere-core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "host.docker.internal:8080" ]
