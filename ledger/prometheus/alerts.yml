groups:
  - name: nexusphere-ledger
    rules:
      - alert: LedgerDown
        expr: up{job="nexusphere-ledger"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The ledger does not answer its metrics endpoint
      - alert: LedgerCheckpointStale
        expr: ledger_checkpoint_lag > 0 and ledger_checkpoint_age_seconds > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: New evidence has waited more than 10 minutes for a signed checkpoint
      - alert: LedgerHighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{job="nexusphere-ledger",status=~"5.."}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The ledger answers more than one 5xx every ten seconds
