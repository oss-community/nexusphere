[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusphere-langgraph"
version = "1.0.0"
description = "Nexusphere Ledger evidence for LangGraph and LangChain tool calls"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["nexusphere-ledger>=1.0.0", "langchain-core>=1.0"]
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["langgraph>=1.0"]

[project.urls]
Homepage = "https://github.com/oss-community/nexusphere"

[tool.setuptools.packages.find]
where = ["src"]
