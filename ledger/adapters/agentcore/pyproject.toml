[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusphere-agentcore"
version = "1.0.0"
description = "Amazon Bedrock AgentCore Gateway interceptor that records tool calls in the Nexusphere Ledger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["nexusphere-ledger>=1.0.0"]
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/oss-community/nexusphere"

[tool.setuptools.packages.find]
where = ["src"]
