receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  nexusphere:
    endpoint: ${env:NEXUSPHERE_LEDGER_URL:-http://localhost:8090}
    api_key: ${env:NEXUSPHERE_LEDGER_API_KEY}
    default_principal: ${env:NEXUSPHERE_DEFAULT_PRINCIPAL:-}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [nexusphere]
