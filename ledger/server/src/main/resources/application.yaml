spring:
  application:
    name: nexusphere-ledger
  config:
    import: optional:configtree:${LEDGER_SECRETS_DIR:/run/secrets/}
  profiles:
    active: ${LEDGER_PROFILES:postgresql}
  mvc:
    problemdetails:
      enabled: false
    async:
      request-timeout: ${LEDGER_STREAM_TIMEOUT:1h}
  flyway:
    schemas: ledger
    default-schema: ledger
    create-schemas: true
    locations: classpath:db/migration/ledger
ledger:
  rate-limit:
    per-minute: ${LEDGER_RATE_LIMIT_PER_MINUTE:1200}
    burst: ${LEDGER_RATE_LIMIT_BURST:200}
  security:
    api-key: ${LEDGER_API_KEY:}
  signing:
    provider: ${LEDGER_SIGNING_PROVIDER:local}
    private-key: ${LEDGER_SIGNING_PRIVATE_KEY:}
    public-key: ${LEDGER_SIGNING_PUBLIC_KEY:}
    previous-private-key: ${LEDGER_SIGNING_PREVIOUS_PRIVATE_KEY:}
    unendorsed-rotation: ${LEDGER_SIGNING_UNENDORSED_ROTATION:false}
    vault:
      address: ${LEDGER_SIGNING_VAULT_ADDRESS:}
      token: ${LEDGER_SIGNING_VAULT_TOKEN:}
      token-file: ${LEDGER_SIGNING_VAULT_TOKEN_FILE:}
      namespace: ${LEDGER_SIGNING_VAULT_NAMESPACE:}
      mount: ${LEDGER_SIGNING_VAULT_MOUNT:transit}
      key: ${LEDGER_SIGNING_VAULT_KEY:nexusphere-ledger}
      timeout: ${LEDGER_SIGNING_VAULT_TIMEOUT:10s}
  checkpoint:
    interval: ${LEDGER_CHECKPOINT_INTERVAL:1m}
  compliance:
    profiles: ${LEDGER_COMPLIANCE_PROFILES:baseline}
    profile-directory: ${LEDGER_COMPLIANCE_PROFILE_DIRECTORY:}
    region: ${LEDGER_COMPLIANCE_REGION:}
    retention-interval: ${LEDGER_COMPLIANCE_RETENTION_INTERVAL:1h}
  timestamp:
    url: ${LEDGER_TIMESTAMP_URL:}
    certificates: ${LEDGER_TIMESTAMP_CERTIFICATES:}
    timeout: ${LEDGER_TIMESTAMP_TIMEOUT:10s}
  rekor:
    url: ${LEDGER_REKOR_URL:}
    key: ${LEDGER_REKOR_KEY:}
    timeout: ${LEDGER_REKOR_TIMEOUT:10s}
  log:
    origin: ${LEDGER_LOG_ORIGIN:}
    witness-timeout: ${LEDGER_LOG_WITNESS_TIMEOUT:10s}
  mcp:
    timeout: ${LEDGER_MCP_TIMEOUT:60s}
  policy:
    default-effect: ${LEDGER_POLICY_DEFAULT_EFFECT:permit}
  approval:
    timeout: ${LEDGER_APPROVAL_TIMEOUT:15m}
    poll-interval: ${LEDGER_APPROVAL_POLL_INTERVAL:5s}
    webhook-url: ${LEDGER_APPROVAL_WEBHOOK_URL:}
    ciba:
      endpoint: ${LEDGER_APPROVAL_CIBA_ENDPOINT:}
      token-endpoint: ${LEDGER_APPROVAL_CIBA_TOKEN_ENDPOINT:}
      client-id: ${LEDGER_APPROVAL_CIBA_CLIENT_ID:}
      client-secret: ${LEDGER_APPROVAL_CIBA_CLIENT_SECRET:}
      scope: ${LEDGER_APPROVAL_CIBA_SCOPE:openid}
  anomaly:
    enabled: ${LEDGER_ANOMALY_ENABLED:true}
    interval: ${LEDGER_ANOMALY_INTERVAL:5m}
    window: ${LEDGER_ANOMALY_WINDOW:1h}
    baseline: ${LEDGER_ANOMALY_BASELINE:7d}
    min-history: ${LEDGER_ANOMALY_MIN_HISTORY:1d}
    threshold: ${LEDGER_ANOMALY_THRESHOLD:3}
    min-events: ${LEDGER_ANOMALY_MIN_EVENTS:10}
  mandate:
    issuer: ${LEDGER_MANDATE_ISSUER:http://localhost:${LEDGER_PORT:8090}}
    status-list-ttl: ${LEDGER_MANDATE_STATUS_LIST_TTL:5m}
  a2a:
    timeout: ${LEDGER_A2A_TIMEOUT:60s}
    request-max-age: ${LEDGER_A2A_REQUEST_MAX_AGE:5m}
    status-list-cache: ${LEDGER_A2A_STATUS_LIST_CACHE:30s}
    trusted-issuers: ${LEDGER_A2A_TRUSTED_ISSUERS:}
  oidc:
    issuer: ${LEDGER_OIDC_ISSUER:}
    audience: ${LEDGER_OIDC_AUDIENCE:}
    jwks-uri: ${LEDGER_OIDC_JWKS_URI:}
    principal-claim: ${LEDGER_OIDC_PRINCIPAL_CLAIM:sub}
    client-id: ${LEDGER_OIDC_CLIENT_ID:}
management:
  server:
    port: ${LEDGER_MANAGEMENT_PORT:}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: nexusphere-ledger
  endpoint:
    health:
      probes:
        enabled: true
  info:
    build:
      enabled: true
