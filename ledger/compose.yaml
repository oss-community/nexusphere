name: ledger
services:
  ledger-postgresql:
    image: postgres:18-alpine
    container_name: ledger-postgresql
    hostname: ledger-postgresql
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    volumes:
      - "ledger-postgresql-data:/var/lib/postgresql"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ledger -d ledger" ]
      interval: 5s
      timeout: 3s
      retries: 20
  ledger-adminer:
    image: adminer
    container_name: ledger-adminer
    hostname: ledger-adminer
    restart: always
    ports:
      - "8092:8080"
    command: [ "php", "-S", "0.0.0.0:8080", "-t", "/var/www/html" ]
    environment:
      ADMINER_DEFAULT_SERVER: ledger-postgresql
    depends_on:
      - ledger-postgresql
  keycloak:
    image: keycloak/keycloak:26.4.2
    container_name: keycloak
    hostname: keycloak
    restart: always
    ports:
      - "8180:8080"
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - "./keycloak:/opt/keycloak/data/import:ro"
  demo-mcp:
    image: samanalishiri/nexusphere-ledger-demo-mcp:latest
    build:
      context: ./demo-mcp
      dockerfile: Dockerfile
    container_name: demo-mcp
    hostname: demo-mcp
    restart: always
    ports:
      - "8091:8091"
  vault:
    image: hashicorp/vault:2.1
    container_name: vault
    hostname: vault
    restart: always
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-nexusphere-vault-development-token}
      SKIP_SETCAP: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  vault-init:
    image: hashicorp/vault:2.1
    container_name: vault-init
    restart: "no"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-nexusphere-vault-development-token}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - vault secrets list | grep -q '^transit/' || vault secrets enable transit; vault read transit/keys/nexusphere-ledger > /dev/null 2>&1 || vault write -f transit/keys/nexusphere-ledger type=ed25519
    depends_on:
      vault:
        condition: service_healthy
  ledger:
    image: samanalishiri/nexusphere-ledger:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger
    hostname: ledger
    restart: always
    ports:
      - "8090:8090"
    environment:
      LEDGER_HOST: "0.0.0.0"
      LEDGER_PORT: "8090"
      LEDGER_PROFILES: postgresql,dev
      LEDGER_DATABASE_HOST: ledger-postgresql
      LEDGER_DATABASE_PORT: "5432"
      LEDGER_DATABASE_DB: ledger
      LEDGER_DATABASE_USERNAME: ledger
      LEDGER_DATABASE_PASSWORD: ledger
      LEDGER_CHECKPOINT_INTERVAL: 30s
      LEDGER_COMPLIANCE_PROFILES: baseline
      LEDGER_MCP_SERVERS_DEMO_URL: http://demo-mcp:8091/mcp
      LEDGER_OIDC_ISSUER: http://localhost:8180/realms/nexusphere
      LEDGER_OIDC_AUDIENCE: nexusphere-ledger
      LEDGER_OIDC_JWKS_URI: http://keycloak:8080/realms/nexusphere/protocol/openid-connect/certs
      LEDGER_OIDC_PRINCIPAL_CLAIM: preferred_username
      LEDGER_SIGNING_PROVIDER: ${LEDGER_SIGNING_PROVIDER:-local}
      LEDGER_SIGNING_PREVIOUS_PRIVATE_KEY: MC4CAQAwBQYDK2VwBCIEIDPXxsOX77t9k2XIr5aVh1AORIeW8w4rXooP+vMeOPKL
      LEDGER_SIGNING_VAULT_ADDRESS: http://vault:8200
      LEDGER_SIGNING_VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-nexusphere-vault-development-token}
    depends_on:
      ledger-postgresql:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      demo-mcp:
        condition: service_started
      keycloak:
        condition: service_started
  otel-collector:
    image: samanalishiri/nexusphere-otelcol:latest
    build:
      context: ./otel-exporter
      dockerfile: Dockerfile
    container_name: otel-collector
    hostname: otel-collector
    restart: always
    ports:
      - "4317:4317"
      - "4318:4318"
    environment:
      NEXUSPHERE_LEDGER_URL: http://ledger:8090
      NEXUSPHERE_LEDGER_API_KEY: nexusphere-ledger-development-key-change-me
    depends_on:
      - ledger
  ledger-ui:
    image: samanalishiri/nexusphere-frontend:latest
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ledger-ui
    hostname: ledger-ui
    restart: always
    ports:
      - "5173:80"
    environment:
      LEDGER_URL: http://ledger:8090
    depends_on:
      - ledger
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    hostname: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - "./prometheus:/etc/prometheus:ro"
    depends_on:
      - ledger
      - alertmanager
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    hostname: alertmanager
    restart: always
    ports:
      - "9093:9093"
    entrypoint: [ "/bin/sh", "/etc/alertmanager/entrypoint.sh" ]
    volumes:
      - "./alertmanager:/etc/alertmanager:ro"
    environment:
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-587}
      ALERT_SMTP_FROM: ${ALERT_SMTP_FROM:-}
      ALERT_SMTP_USERNAME: ${ALERT_SMTP_USERNAME:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_SMTP_TLS: ${ALERT_SMTP_TLS:-true}
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
      ALERT_SLACK_CHANNEL: ${ALERT_SLACK_CHANNEL:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  ledger-postgresql-data:
