[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusphere-ledger"
version = "1.0.0"
description = "Client and offline verifier for the Nexusphere Ledger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/oss-community/nexusphere"

[project.scripts]
nexusphere-ledger-verify = "nexusphere_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
