# Local infrastructure for Nexusphere Core V1.
# Only PostgreSQL is required; Kafka, Redis and Keycloak are not part of V1.
name: nexusphere

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: nexusphere
      POSTGRES_USER: nexusphere
      POSTGRES_PASSWORD: nexusphere
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusphere -d nexusphere"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
