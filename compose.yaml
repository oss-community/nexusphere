name: dev
services:
  postgresql:
    image: postgres:18-alpine
    container_name: postgresql
    hostname: postgresql
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nexusphere
      POSTGRES_PASSWORD: nexusphere
      POSTGRES_DB: nexusphere
    volumes:
      - "postgresql-data:/var/lib/postgresql"
      - "./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro"
  adminer:
    image: adminer
    container_name: adminer
    hostname: adminer
    restart: always
    ports:
      - "8082:8080"
    command: [ "php", "-S", "0.0.0.0:8080", "-t", "/var/www/html" ]
    environment:
      ADMINER_DEFAULT_SERVER: postgresql
  application:
    image: samanalishiri/nexusphere:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: application
    hostname: application
    restart: always
    ports:
      - "8080:8080"
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
      APP_PROFILES: postgresql,dev
      APP_DATABASE_HOST: postgresql
      APP_DATABASE_PORT: "5432"
      APP_DATABASE_DB: nexusphere
      APP_DATABASE_USERNAME: nexusphere
      APP_DATABASE_PASSWORD: nexusphere
      APP_TOKEN_ISSUER: nexusphere
      APP_TOKEN_SECRET: nexusphere-development-token-secret-change-me
      APP_TOKEN_TTL: 15m
      APP_OPERATOR_SECRET: nexusphere-development-operator-secret-change-me
    depends_on:
      - postgresql
      - adminer
volumes:
  postgresql-data:
